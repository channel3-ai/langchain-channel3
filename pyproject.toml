[project]
name = "langchain-channel3"
version = "0.1.0"
description = "Channel3 product search tools for LangChain: search 100M+ products and compare live retailer offers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Channel3", email = "support@trychannel3.com" }]
requires-python = ">=3.10,<4.0"
keywords = ["langchain", "channel3", "shopping", "product-search", "ecommerce", "agents", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "channel3-sdk>=4.8.0,<5.0.0",
]

[project.urls]
Homepage = "https://channel3.ai/docs/langchain"
Documentation = "https://channel3.ai/docs/langchain"
"Source Code" = "https://github.com/channel3-ai/langchain-channel3"
repository = "https://github.com/channel3-ai/langchain-channel3"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "langchain-tests>=1.1.0",
]
lint = ["ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_channel3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["compile: mark placeholder test used to compile integration tests without running them"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP045"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120
